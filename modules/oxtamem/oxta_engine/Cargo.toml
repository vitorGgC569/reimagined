[package]
name = "oxta_mem"
version = "0.1.1"
edition = "2024"
license = "MIT"

# MSVC prints the expected import-library creation notice on linker stdout.
# Rust 1.90+ classifies any linker stdout as `linker_messages`; allow this
# informational toolchain message while retaining every code/compiler warning.
[lints.rust]
linker_messages = "allow"

[lib]
name = "oxta_mem"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[[bin]]
name = "oxta_mem_server"
path = "src/main.rs"

[dependencies]
bytes = "1.11.1"
clap = { version = "4.5.54", features = ["derive", "env"] }
memmap2 = "0.9.9"
pyo3 = { version = "0.27.2", features = ["extension-module"], optional = true }
rkyv = "0.8.14"
tokio = { version = "1.49.0", features = ["full"] }
# default-features=false drops the vendored `simsimd` C code, whose AVX-512-FP16
# intrinsics fail to compile on some toolchains (e.g. Colab's gcc). usearch falls
# back to its portable distance path — identical results, just without SIMD accel.
usearch = { version = "2.23.0", default-features = false, features = ["fp16lib"] }
